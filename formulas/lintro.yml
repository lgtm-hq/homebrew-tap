---
package: lintro
source-repo: lgtm-hq/py-lintro
homepage: https://github.com/lgtm-hq/py-lintro
license: MIT
description: "Unified CLI for code formatting, linting, and quality assurance"

formulas:
  lintro:
    type: binary
    test-command: "lintro --version"
    binary-url-pattern: >-
      https://github.com/lgtm-hq/py-lintro/releases/download/v{version}/lintro-macos-{arch}
    binary-names:
      arm64: lintro-macos-arm64
      x86_64: lintro-macos-x86_64
    install-name: lintro
    full-formula-ref: lintro-full
    conflicts-with:
      formula: lintro-full
      because: both provide the lintro binary
      comment: Shares the "lintro" binary with the PyPI-based full formula.
    test-extra: |
      assert_match "Usage:", shell_output("#{bin}/lintro --help")
      # `lintro doctor` reports tool status and may exit non-zero when optional
      # tools are missing, so assert on its output rather than the exit status.
      # Doctor prints emoji: the inline PYTHONIOENCODING survives brew test's
      # scrubbed ASCII environment where an ENV assignment does not.
      assert_match "Lintro Doctor", pipe_output("PYTHONIOENCODING=utf-8 #{bin}/lintro doctor 2>&1")
    caveats: |
      lintro is a lightweight standalone binary (no Python required).

      Install tools with:
        lintro doctor
        lintro install --profile recommended

      For all tools bundled via Homebrew dependencies:
        brew install lgtm-hq/tap/lintro-full

  lintro-full:
    type: pypi
    python-version: "3.13"
    test-command: "lintro --version"
    generate-resources: true
    min-resource-count: 5
    class-name: LintroFull
    description: "Unified CLI for code quality (all tools included)"
    head: true
    bottle-comment: true
    conflicts-with:
      formula: lintro
      because: both provide the lintro binary
      comment: Shares the "lintro" binary with the lightweight binary formula.
    test-extra: |
      assert_match "Usage:", shell_output("#{bin}/lintro --help")
      # `lintro doctor` reports tool status and may exit non-zero when optional
      # tools are missing, so assert on its output rather than the exit status.
      # Doctor prints emoji: the inline PYTHONIOENCODING survives brew test's
      # scrubbed ASCII environment where an ENV assignment does not.
      assert_match "Lintro Doctor", pipe_output("PYTHONIOENCODING=utf-8 #{bin}/lintro doctor 2>&1")
    homebrew-deps:
      - actionlint
      - bandit
      - black
      - commitlint
      - dotenv-linter
      - gitleaks
      - hadolint
      - libyaml
      - markdownlint-cli2
      - mypy
      - oxfmt
      - oxlint
      - prettier
      - ruff
      - rust
      - semgrep
      - shellcheck
      - shfmt
      - sqlfluff
      - taplo
      - vale
      - yamllint
    wheel-only-packages:
      pydoclint:
        type: universal
        comment: "pydoclint - use wheel for consistency"
      pydantic-core:
        type: platform
        resolve-version-from: pydantic-core
        comment: >-
          pydantic-core requires Rust to build - use platform-specific wheels
    caveats: |
      Lintro is now installed (#{deps.count} Homebrew formulae included).

      Python quality:   ruff, black, mypy, bandit, pydoclint (bundled)
      YAML / TOML:      yamllint, taplo
      Shell:            shellcheck, shfmt
      Dotenv:           dotenv-linter
      Markdown:         markdownlint-cli2
      Prose / docs:     vale
      JS / TS:          oxlint, oxfmt, prettier
      Dockerfiles:      hadolint
      GitHub Actions:   actionlint
      Git commits:      commitlint
      Security:         gitleaks, semgrep
      Rust:             clippy, rustfmt (via rust)
      SQL:              sqlfluff

      Not installed automatically (install if needed):
        cargo install cargo-audit cargo-deny   # Rust dependency auditing
        npm install -g astro svelte-check vue-tsc  # Framework type-checkers

      Run 'lintro doctor' to check tool status and get install hints.

      Get started:
        lintro check .        # Lint your project
        lintro format .       # Auto-fix issues
        lintro doctor         # Check which tools are available
