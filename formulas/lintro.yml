---
package: lintro
source-repo: lgtm-hq/py-lintro
homepage: https://github.com/lgtm-hq/py-lintro
license: MIT
description: "Unified CLI for code formatting, linting, and quality assurance"

# What the tap verifies before pinning a digest (lgtm-hq/homebrew-tap#471;
# checks live in scripts/ci/lib/provenance.sh). Identities verified against
# py-lintro releases from v0.160.3a4 onwards (lgtm-hq/py-lintro#2562):
#   - release binaries are attested by the nested reusable build-binaries.yml
#   - sdist/wheel are attested by lgtm-ci's reusable-build-python-dist.yml
#   - PyPI records publish-pypi-on-tag.yml as the Trusted Publisher workflow
# `gh attestation verify` refuses --signer-repo next to --signer-workflow, so
# each workflow value carries its own repository prefix.
provenance:
  require-attestation: true
  repo: lgtm-hq/py-lintro
  tag-prefix: v
  binary-signer-workflow: >-
    lgtm-hq/py-lintro/.github/workflows/build-binaries.yml
  sdist-signer-workflow: >-
    lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml
  pypi-publisher-workflow: publish-pypi-on-tag.yml

formulas:
  lintro:
    type: binary
    test-command: "lintro --version"
    binary-url-pattern: >-
      https://github.com/lgtm-hq/py-lintro/releases/download/v{version}/lintro-macos-{arch}
    binary-names:
      arm64: lintro-macos-arm64
    install-name: lintro
    # Intel Macs get no release binary (lgtm-hq/py-lintro#2579): the formula's
    # on_intel branch installs the same version from the PyPI sdist.
    #
    # Pinning choice (lgtm-hq/homebrew-tap#471, item 3): the on_intel block
    # carries the full dependency closure of `lintro[mcp]` as url+sha256
    # resources, generated by the same code path as lintro-full, and the
    # install step only ever runs pip with --no-deps. The alternative
    # (`pip install --no-deps` plus a hand-picked runtime subset) was rejected
    # because the subset would drift from the sdist metadata silently.
    # Linting tools are still not bundled (`lintro install` fetches them),
    # matching the arm64 binary's footprint.
    intel-pypi:
      python-version: "3.13"
      extras:
        - mcp
      min-resource-count: 5
      homebrew-deps:
        - libyaml
        # cryptography and rpds-py are pinned as sdists (no x86_64 macOS
        # wheel for cryptography at this pin) and build Rust extensions
        # with maturin/cargo, so the Intel source build needs a toolchain
        # at build time only.
        - name: rust
          build: true
      wheel-only-packages:
        pydantic-core:
          type: platform
          resolve-version-from: pydantic-core
          comment: >-
            pydantic-core requires Rust to build - use platform-specific wheels
    full-formula-ref: lintro-full
    conflicts-with:
      formula: lintro-full
      because: both provide the lintro binary
      comment: Shares the "lintro" binary with the PyPI-based full formula.
    test-extra: |
      # Help output renders emoji; brew test's ASCII locale crashes the
      # binary with UnicodeEncodeError, so force UTF-8 inline (an ENV
      # assignment does not reach the subprocess).
      utf8 = "LC_ALL=en_US.UTF-8"
      assert_match "Usage:", shell_output("#{utf8} #{bin}/lintro --help")
      # `lintro doctor` reports tool status and may exit non-zero when optional
      # tools are missing, so assert on its output rather than the exit status.
      doctor_cmd = "#{utf8} #{bin}/lintro doctor 2>&1"
      assert_match "Lintro Doctor", pipe_output(doctor_cmd)
    caveats: |
      lintro is a lightweight install: a standalone binary on Apple silicon
      (no Python required) and a PyPI virtualenv on Intel Macs.

      Install tools with:
        lintro doctor
        lintro install --profile recommended

      For all tools bundled via Homebrew dependencies:
        brew install lgtm-hq/tap/lintro-full

  lintro-full:
    type: pypi
    python-version: "3.13"
    test-command: "lintro --version"
    generate-resources: true
    min-resource-count: 5
    class-name: LintroFull
    description: "Unified CLI for code quality (all tools included)"
    head: true
    conflicts-with:
      formula: lintro
      because: both provide the lintro binary
      comment: Shares the "lintro" binary with the lightweight binary formula.
    test-extra: |
      # Help output renders emoji; brew test's ASCII locale crashes the
      # binary with UnicodeEncodeError, so force UTF-8 inline (an ENV
      # assignment does not reach the subprocess).
      utf8 = "LC_ALL=en_US.UTF-8"
      assert_match "Usage:", shell_output("#{utf8} #{bin}/lintro --help")
      # `lintro doctor` reports tool status and may exit non-zero when optional
      # tools are missing, so assert on its output rather than the exit status.
      doctor_cmd = "#{utf8} #{bin}/lintro doctor 2>&1"
      assert_match "Lintro Doctor", pipe_output(doctor_cmd)
    homebrew-deps:
      - actionlint
      - bandit
      - black
      - commitlint
      - dotenv-linter
      - gitleaks
      - hadolint
      - libyaml
      - markdownlint-cli2
      - mypy
      - oxfmt
      - oxlint
      - prettier
      - ruff
      - rust
      - semgrep
      - shellcheck
      - shfmt
      - sqlfluff
      - taplo
      - vale
      - yamllint
    wheel-only-packages:
      pydoclint:
        type: universal
        comment: "pydoclint - use wheel for consistency"
      pydantic-core:
        type: platform
        resolve-version-from: pydantic-core
        comment: >-
          pydantic-core requires Rust to build - use platform-specific wheels
    caveats: |
      Lintro is now installed (#{deps.count} Homebrew formulae included).

      Python quality:   ruff, black, mypy, bandit, pydoclint (bundled)
      YAML / TOML:      yamllint, taplo
      Shell:            shellcheck, shfmt
      Dotenv:           dotenv-linter
      Markdown:         markdownlint-cli2
      Prose / docs:     vale
      JS / TS:          oxlint, oxfmt, prettier
      Dockerfiles:      hadolint
      GitHub Actions:   actionlint
      Git commits:      commitlint
      Security:         gitleaks, semgrep
      Rust:             clippy, rustfmt (via rust)
      SQL:              sqlfluff

      Not installed automatically (install if needed):
        cargo install cargo-audit cargo-deny   # Rust dependency auditing
        npm install -g astro svelte-check vue-tsc  # Framework type-checkers

      Run 'lintro doctor' to check tool status and get install hints.

      Get started:
        lintro check .        # Lint your project
        lintro format .       # Auto-fix issues
        lintro doctor         # Check which tools are available
