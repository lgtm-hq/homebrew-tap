---
name: Merge - Release Bot Tap PR

"on":
  workflow_run:
    workflows:
      - Quality Check - Homebrew Formula Validation (Tap)
    types:
      - completed

permissions:
  contents: read

jobs:
  merge-release-bot-pr:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v6.0.2
        with:
          persist-credentials: false

      - name: Merge trusted release-bot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bash scripts/ci/merge-release-bot-pr.sh
