---
name: Quality Check - Homebrew Formula Validation (Tap)

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Formula/**"
      - "formulas/**"
      - ".github/workflows/validate-homebrew-formula.yml"
      - ".github/workflows/update-formula.yml"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "formulas/**"
      - ".github/workflows/validate-homebrew-formula.yml"
      - ".github/workflows/update-formula.yml"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-formula:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v6.0.2

      - name: Validate all formulas
        run: scripts/ci/validate-formulas.sh
