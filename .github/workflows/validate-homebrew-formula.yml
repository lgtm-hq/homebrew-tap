---
name: Quality Check - Homebrew Formula Validation (Tap)

# validate-formula is a required status check. It must therefore report on every
# PR, or non-formula PRs deadlock on a check that never runs. The workflow runs
# on all PRs; the `changes` job decides whether the full macOS validation is
# needed, and the `validate-formula` job reports success cheaply when it is not.
# A push to main validates only the formulas the push changed (#661); pull
# requests, the merge queue and manual dispatch validate every formula.

'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      formula: ${{ steps.detect.outputs.formula }}
      formulas: ${{ steps.detect.outputs.formulas }}
      runner: ${{ steps.detect.outputs.runner }}
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect formula-related changes
        id: detect
        env:
          LGTM_CI_RUNNER: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
          EVENT_NAME: ${{ github.event_name }}
          # A push compares against its `before` commit; the script validates
          # every formula when that commit is all zeros or not an ancestor.
          PUSH_BEFORE: ${{ github.event.before }}
          # merge_group has no pull_request context; fall back to its SHAs
          # so queue entries keep the cheap early-exit path for non-formula
          # changes.
          # yamllint disable rule:line-length
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          # yamllint enable rule:line-length
        run: bash scripts/ci/detect-formula-changes.sh

  validate-formula:
    name: 🍺 Validate Formula
    needs: changes
    # macOS/Homebrew when formula files change; cheap Ubuntu no-op otherwise.
    runs-on: ${{ needs.changes.outputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: needs.changes.outputs.formula == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate formulas
        if: needs.changes.outputs.formula == 'true'
        env:
          # Empty validates every formula.
          FORMULAS: ${{ needs.changes.outputs.formulas }}
        run: scripts/ci/validate-formulas.sh

      - name: Skip validation (no formula changes)
        if: needs.changes.outputs.formula != 'true'
        run: echo "No formula-related changes; formula validation not required."
