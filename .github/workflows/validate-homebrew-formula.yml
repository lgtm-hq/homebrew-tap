---
name: Quality Check - Homebrew Formula Validation (Tap)

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Formula/**"
      - "formulas/**"
      - ".github/workflows/validate-homebrew-formula.yml"
      - ".github/workflows/update-formula.yml"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "formulas/**"
      - ".github/workflows/validate-homebrew-formula.yml"
      - ".github/workflows/update-formula.yml"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-formula:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate all formulas
        run: scripts/ci/validate-formulas.sh
