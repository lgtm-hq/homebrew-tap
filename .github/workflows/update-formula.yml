---
name: Update - Homebrew Formula

"on":
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Python
        uses: actions/setup-python@8f8098deeaa281d25c1c56b5abd0c865784a148
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml packaging

      - name: Parse dispatch payload
        id: payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: bash scripts/ci/parse-dispatch-payload.sh

      - name: Generate formulas and open PR
        env:
          DISPATCH_FORMULA: ${{ steps.payload.outputs.formula }}
          DISPATCH_VERSION: ${{ steps.payload.outputs.version }}
          DISPATCH_PYPI_PACKAGE: ${{ steps.payload.outputs.pypi-package }}
          DISPATCH_BINARY_ASSETS: ${{ steps.payload.outputs.binary-assets }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/update-formula.sh
