---
name: Update - Homebrew Formula

concurrency:
  # yamllint disable-line rule:line-length
  group: update-formula-${{ github.repository }}-${{ github.event.client_payload.formula }}
  cancel-in-progress: true

"on":
  repository_dispatch:
    types: [update-formula]

jobs:
  update-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      LGTM_CI_TOOLING_REF: 66cad82ead0e5d119928c895c7d7da9c837989e5  # v0.52.3
    steps:
      # Direct remote harden-runner step: the lgtm-ci local composite was
      # removed in v0.50.0 (lgtm-ci#467), and GitHub skips pre hooks for
      # workspace-local actions anyway. The allowlist must be a literal,
      # space-separated folded scalar (replace semantics): the pypi preset
      # equivalent plus setup-uv/astral download endpoints.
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            test.pypi.org:443
            upload.pypi.org:443
            upload.test.pypi.org:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: ${{ env.LGTM_CI_TOOLING_REF }}
          sparse-checkout: |
            .github/actions/setup-python
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up Python
        uses: ./.lgtm-ci-tooling/.github/actions/setup-python
        with:
          python-version: "3.13"
          install-dependencies: "true"
          cache: "false"

      - name: Parse dispatch payload
        id: payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: bash scripts/ci/parse-dispatch-payload.sh

      - name: Create Homebrew tap GitHub App token
        id: homebrew-app-token
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Generate formulas and open PR
        env:
          DISPATCH_FORMULA: ${{ steps.payload.outputs.formula }}
          DISPATCH_VERSION: ${{ steps.payload.outputs.version }}
          DISPATCH_PYPI_PACKAGE: ${{ steps.payload.outputs.pypi-package }}
          DISPATCH_BINARY_ASSETS: ${{ steps.payload.outputs.binary-assets }}
          # Open the PR as the App (not GITHUB_TOKEN) so pull_request CI
          # runs and the release-bot PR can auto-merge. See #80. Commits are
          # created via GraphQL createCommitOnBranch with this token, so they
          # are GitHub-signed (required_signatures). See #129.
          GH_TOKEN: ${{ steps.homebrew-app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LGTM_CI_TOOLING_DIR: ${{ github.workspace }}/.lgtm-ci-tooling
        run: uv run bash scripts/ci/update-formula.sh
