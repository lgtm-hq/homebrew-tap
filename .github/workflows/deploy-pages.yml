---
name: Deploy - GitHub Pages

concurrency:
  group: deploy-pages-${{ github.repository }}
  cancel-in-progress: false

"on":
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "formulas/**"
      - "scripts/ci/build_pages.py"
      - "scripts/ci/templates/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LGTM_CI_TOOLING_REF: 23c79b65490a3307fb08cdefafa22db12f75b9b2  # v0.63.1
    steps:
      # Direct remote harden-runner step: the lgtm-ci local composite was
      # removed in v0.50.0 (lgtm-ci#467), and GitHub skips pre hooks for
      # workspace-local actions anyway. The allowlist must be a literal,
      # space-separated folded scalar (replace semantics): the pypi preset
      # equivalent plus setup-uv/astral download and Pages artifact endpoints.
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            test.pypi.org:443
            upload.pypi.org:443
            upload.test.pypi.org:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: ${{ env.LGTM_CI_TOOLING_REF }}
          sparse-checkout: |
            .github/actions/setup-python
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up Python
        uses: ./.lgtm-ci-tooling/.github/actions/setup-python
        with:
          python-version: "3.13"
          install-dependencies: "true"
          cache: "false"

      - name: Build landing page
        run: uv run python scripts/ci/build_pages.py --output _site/index.html

      - name: Upload Pages artifact
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write  # deploy to GitHub Pages
      id-token: write  # verify deployment origin (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
