---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read  # checkout repository code
      packages: read  # pull py-lintro container image
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@31c25ef2e8992960e218524780e34f44f51271b5  # v0.54.0
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      job-name: "🛠️ Lintro Code Quality"
      egress-policy: block
      egress-preset: quality
      runner-image: ubuntu-24.04

  publish-pr-comment:
    needs: quality
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read  # read quality job outputs and artifacts
      pull-requests: write  # post lint summary to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@31c25ef2e8992960e218524780e34f44f51271b5  # v0.54.0
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      # yamllint disable-line rule:line-length
      exit-code: ${{ needs.quality.outputs.exit-code != '' && needs.quality.outputs.exit-code || '1' }}
      job-name: "PR Lint Comment"
      egress-policy: block
      egress-preset: github-tooling

  shell-tests:
    permissions:
      contents: read  # checkout repository code
      pull-requests: write  # post test results/coverage to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@31c25ef2e8992960e218524780e34f44f51271b5  # v0.54.0
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      job-name: "🐚 Shell Tests"
      test-path: tests/bats
      coverage: true
      coverage-threshold: 0
      upload-coverage: false
      egress-preset: github-tooling
      # Since lgtm-ci v0.50.0 the reusable feeds allowed-endpoints directly to
      # the job-start step-security/harden-runner step (pre-hook enforcement):
      # a non-empty value REPLACES the reusable's default baseline instead of
      # appending to it, so the list must be complete (default GitHub + Ubuntu
      # archive endpoints plus our extras: release assets for bats/kcov
      # downloads; PyPI hosts for uv sync). It must also be space-separated
      # (YAML folded scalar) — the harden-runner agent splits on spaces, so a
      # newline-separated literal block is parsed as a single bogus endpoint
      # and everything gets blocked.
      allowed-endpoints-mode: append
      allowed-endpoints: >-
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        archive.ubuntu.com:80
        azure.archive.ubuntu.com:80
        security.ubuntu.com:80
        security.ubuntu.com:443
        release-assets.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
