---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read  # checkout repository code
      packages: read  # pull py-lintro container image
      pull-requests: write  # post lint results to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@ba485556d3d4605b825347c2fe431ad4395b1c63  # v0.44.1
    with:
      tooling-ref: "ba485556d3d4605b825347c2fe431ad4395b1c63"

  shell-tests:
    permissions:
      contents: read  # checkout repository code
      pull-requests: write  # post test results/coverage to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@ba485556d3d4605b825347c2fe431ad4395b1c63  # v0.44.1
    with:
      tooling-ref: "ba485556d3d4605b825347c2fe431ad4395b1c63"
      test-path: tests/bats
      coverage: true
      coverage-threshold: 0
      upload-coverage: false
      egress-preset: github-tooling
