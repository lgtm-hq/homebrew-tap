---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read  # checkout repository code
      packages: read  # pull py-lintro container image
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@66cad82ead0e5d119928c895c7d7da9c837989e5  # v0.52.3
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      job-name: "Lintro Quality Checks"
      egress-policy: block
      egress-preset: quality
      runner-image: ubuntu-24.04

  publish-pr-comment:
    needs: quality
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read  # read quality job outputs and artifacts
      pull-requests: write  # post lint summary to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@66cad82ead0e5d119928c895c7d7da9c837989e5  # v0.52.3
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      # yamllint disable-line rule:line-length
      exit-code: ${{ needs.quality.outputs.exit-code != '' && needs.quality.outputs.exit-code || '1' }}
      job-name: "PR Lint Comment"
      egress-policy: block
      egress-preset: github-tooling

  shell-tests:
    permissions:
      contents: read  # checkout repository code
      pull-requests: write  # post test results/coverage to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@66cad82ead0e5d119928c895c7d7da9c837989e5  # v0.52.3
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      test-path: tests/bats
      coverage: true
      coverage-threshold: 0
      upload-coverage: false
      egress-preset: github-tooling
      # uv sync needs astral hosts; reusable-test-shell does not install uv.
      allowed-endpoints-mode: append
      allowed-endpoints: |
        release-assets.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
