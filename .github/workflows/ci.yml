---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read  # checkout repository code
      packages: read  # pull py-lintro container image
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@509b10a0c813895e4be2989f3e7ef2e8aa14eca3  # v0.45.0
    with:
      tooling-ref: "509b10a0c813895e4be2989f3e7ef2e8aa14eca3"
      job-name: "Lintro Quality Checks"
      egress-policy: block
      egress-preset: quality
      runner-image: ubuntu-24.04

  publish-pr-comment:
    needs: quality
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read  # read quality job outputs and artifacts
      pull-requests: write  # post lint summary to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@509b10a0c813895e4be2989f3e7ef2e8aa14eca3  # v0.45.0
    with:
      tooling-ref: "509b10a0c813895e4be2989f3e7ef2e8aa14eca3"
      # yamllint disable-line rule:line-length
      exit-code: ${{ needs.quality.outputs.exit-code != '' && needs.quality.outputs.exit-code || '1' }}
      job-name: "PR Lint Comment"
      egress-policy: block
      egress-preset: github-tooling

  shell-tests:
    permissions:
      contents: read  # checkout repository code
      pull-requests: write  # post test results/coverage to PR
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@509b10a0c813895e4be2989f3e7ef2e8aa14eca3  # v0.45.0
    with:
      tooling-ref: "509b10a0c813895e4be2989f3e7ef2e8aa14eca3"
      test-path: tests/bats
      coverage: true
      coverage-threshold: 0
      upload-coverage: false
      egress-preset: github-tooling
