---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@7c82f643fd70415c58d55c182c9d994cbd45075e  # v0.74.0
    with:
      tooling-ref: "7c82f643fd70415c58d55c182c9d994cbd45075e"  # # v0.74.0
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
