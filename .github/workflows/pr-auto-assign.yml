---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d1a4cbe278d60e631d95800f449d25e174140ea1 # v0.77.4
    with:
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
