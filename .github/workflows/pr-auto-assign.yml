---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@31c25ef2e8992960e218524780e34f44f51271b5  # v0.54.0
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
