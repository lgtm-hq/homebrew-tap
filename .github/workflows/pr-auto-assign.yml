---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@1cc47fba7da08ab82796f2e2431f09ad3c58e719 # v0.98.5
    with:
      egress-policy: block
      tooling-ref: '1cc47fba7da08ab82796f2e2431f09ad3c58e719' # v0.98.5
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
