---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@8a6b1f553f1a0400a70db8910094073ce803cc4d  # v0.69.5
    with:
      tooling-ref: "23c79b65490a3307fb08cdefafa22db12f75b9b2"
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
