---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@234e84901ae4ac14f2d44f02fad517d95712cec3  # v0.75.0
    with:
      tooling-ref: "234e84901ae4ac14f2d44f02fad517d95712cec3" # v0.75.0
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
