---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36  # v0.69.8
    with:
      tooling-ref: "f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36" # v0.69.8
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
