---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@f63b85534ce3a561f177c4ee3417b17c04f14a8b # v0.83.1
    with:
      egress-policy: block
      tooling-ref: 'f63b85534ce3a561f177c4ee3417b17c04f14a8b' # v0.83.1
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
