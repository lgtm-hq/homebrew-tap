---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@710c7ba40bf7b48b4d7c3442e3b60fb4b542db91 # v0.77.5
    with:
      tooling-ref: '710c7ba40bf7b48b4d7c3442e3b60fb4b542db91' # v0.77.5
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
