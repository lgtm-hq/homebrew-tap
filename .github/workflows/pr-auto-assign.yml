---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@4aaefe64763b7841b6d92d94dc47185083d34c9a  # v0.46.0
    with:
      tooling-ref: "6a80f4a55e4080272b2d93b30cc292d618f5dd5a"
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
