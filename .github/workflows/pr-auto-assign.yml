---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@42aad382e0ca51e425a24f54053c298e588a9862 # v0.82.2
    with:
      egress-policy: block
      tooling-ref: '42aad382e0ca51e425a24f54053c298e588a9862' # v0.82.2
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
