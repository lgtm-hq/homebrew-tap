---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      egress-policy: block
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
