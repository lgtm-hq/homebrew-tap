---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      egress-policy: block
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
