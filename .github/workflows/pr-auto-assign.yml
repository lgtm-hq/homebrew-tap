---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d32388495d571a0ee13383bacc732765bf4e9e7d  # v0.74.6
    with:
      tooling-ref: "d32388495d571a0ee13383bacc732765bf4e9e7d"  # v0.74.6
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
