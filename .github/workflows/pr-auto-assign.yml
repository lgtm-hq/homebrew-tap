---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read  # read CODEOWNERS file
      pull-requests: write  # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2  # v0.63.1
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
