---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      contents: read # read CODEOWNERS file
      pull-requests: write # set assignee and request review
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@1c0efb61622a0e6827cfa0baaa4ca84514abe6ca # v0.83.10
    with:
      egress-policy: block
      tooling-ref: '1c0efb61622a0e6827cfa0baaa4ca84514abe6ca' # v0.83.10
      codeowners-path: .github/CODEOWNERS
      egress-preset: github-tooling
