---
# Homebrew tap — run the full lintro tool set, with tap-specific defaults below.
# https://github.com/lgtm-hq/py-lintro

enforce:
  line_length: 88

execution:
  tool_order: priority
  fail_fast: false

defaults:
  yamllint:
    extends: default
    rules:
      comments-indentation: disable
      comments:
        min-spaces-from-content: 1
      line-length:
        max: 88
        allow-non-breakable-inline-mappings: true

  shellcheck:
    severity: warning

tools:
  actionlint:
    enabled: true
  gitleaks:
    enabled: true
  # This tap has no Python files. Keep applicable tools enabled, but skip
  # mypy until py-lintro#930 treats no-Python repos as a clean Docker no-op.
  mypy:
    enabled: false
  osv_scanner:
    enabled: true
  prettier:
    enabled: true
  # lintro 0.147.x bundles pylint, which scans the vendored lgtm-ci tooling
  # scripts; that catalogue is gated upstream in lgtm-ci's own repo.
  pylint:
    enabled: false
  semgrep:
    enabled: true
  shellcheck:
    enabled: true
  shfmt:
    enabled: true
  yamllint:
    enabled: true
