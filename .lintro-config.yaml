---
# Homebrew tap — workflows, shell scripts, and docs (no Rust/Python/Node).
# https://github.com/lgtm-hq/py-lintro

enforce:
  line_length: 88

execution:
  enabled_tools:
    - actionlint
    - gitleaks
    - osv_scanner
    - prettier
    - semgrep
    - shellcheck
    - shfmt
    - yamllint
  tool_order: priority
  fail_fast: false

defaults:
  yamllint:
    extends: default
    rules:
      comments-indentation: disable
      comments:
        min-spaces-from-content: 1
      line-length:
        max: 88
        allow-non-breakable-inline-mappings: true

  shellcheck:
    severity: warning

tools:
  actionlint:
    enabled: true
  gitleaks:
    enabled: true
  osv_scanner:
    enabled: true
  prettier:
    enabled: true
  semgrep:
    enabled: true
  shellcheck:
    enabled: true
  shfmt:
    enabled: true
  yamllint:
    enabled: true
