---
# Homebrew tap — run the full lintro tool set, with tap-specific defaults below.
# https://github.com/lgtm-hq/py-lintro

enforce:
  line_length: 88

execution:
  tool_order: priority
  fail_fast: false
  parallel: true

defaults:
  prettier:
    semi: true
    singleQuote: true
    tabWidth: 2
    printWidth: 100
    trailingComma: es5
    overrides:
      - files: '*.md'
        options:
          # Matches MD013 line_length in .markdownlint-cli2.jsonc.
          printWidth: 80

  yamllint:
    extends: default
    rules:
      comments-indentation: disable
      comments:
        min-spaces-from-content: 1
      truthy:
        check-keys: true
      line-length:
        max: 88
        allow-non-breakable-inline-mappings: true

  shellcheck:
    severity: warning

tools:
  actionlint:
    enabled: true
  gitleaks:
    enabled: true
  # This tap has no Python files. Keep applicable tools enabled, but skip
  # mypy until py-lintro#930 treats no-Python repos as a clean Docker no-op.
  mypy:
    enabled: false
  osv_scanner:
    enabled: true
  prettier:
    enabled: true
  semgrep:
    enabled: true
  shellcheck:
    enabled: true
  shfmt:
    enabled: true
  yamllint:
    enabled: true
