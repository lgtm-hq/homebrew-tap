[project]
name = "homebrew-tap"
version = "0.0.0"
description = "CI and test tooling dependencies for the lgtm-hq Homebrew tap"
requires-python = ">=3.13"
dependencies = ["packaging>=21.0", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.ruff]
# Vendored CI scripts live here; declaring src makes first-party import
# detection (e.g. sibling module `pypi_utils`) independent of the directory
# ruff is invoked from.
src = ["scripts/ci"]
